name: Update check

# Installs an old version of the desktop app on each system, then updates it to a newer one the way
# the app does (DesktopAppUpdater, driven by core/data's UpdateInstallCheck) from a releases list
# served on the runner, and checks that the newer version took the old one's place.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - core/data/src/jvmMain/kotlin/com/tayra/languages/core/data/runtime/DesktopAppUpdater.kt
      - core/data/src/jvmTest/kotlin/com/tayra/languages/core/data/UpdateInstallCheck.kt
      - desktopApp/build.gradle.kts
      - tools/make_update_feed.py
      - .github/workflows/update-check.yml

env:
  OLD: 0.0.1
  NEW: 0.0.2
  FEED: http://127.0.0.1:8765/releases

jobs:
  macos:
    name: macOS app bundle from the DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the old app and the new DMG
        run: |
          B=desktopApp/build/compose/binaries/main
          ./gradlew --no-daemon :desktopApp:createDistributable -PreleaseVersion=$OLD
          mkdir -p "$RUNNER_TEMP/Apps" "$RUNNER_TEMP/feed"
          ditto $B/app/TayraLanguages.app "$RUNNER_TEMP/Apps/TayraLanguages.app"
          ./gradlew --no-daemon :desktopApp:packageDmg -PreleaseVersion=$NEW
          cp $B/dmg/*.dmg "$RUNNER_TEMP/feed/TayraLanguages-$NEW-macos-arm64.dmg"
      - name: Update the old app as it does itself
        run: |
          (cd "$RUNNER_TEMP/feed" && python3 "$GITHUB_WORKSPACE/tools/make_update_feed.py" $NEW http://127.0.0.1:8765 TayraLanguages-$NEW-macos-arm64.dmg)
          (cd "$RUNNER_TEMP/feed" && python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &)
          sleep 2
          TAYRA_UPDATE_LAUNCHER="$RUNNER_TEMP/Apps/TayraLanguages.app/Contents/MacOS/TayraLanguages" TAYRA_UPDATE_FROM=$OLD TAYRA_UPDATE_FEED=$FEED \
            TAYRA_UPDATE_WORK="$RUNNER_TEMP/work dir" TAYRA_UPDATE_EXPECT=MAC_APP \
            ./gradlew --no-daemon :core:data:jvmTest --tests '*UpdateInstallCheck*' --rerun -i > "$RUNNER_TEMP/check.log" 2>&1 || { tail -80 "$RUNNER_TEMP/check.log"; exit 1; }
          grep -E "Installing|would quit" "$RUNNER_TEMP/check.log"
      - name: Check that the new version took the old one's place
        run: |
          cfg="$RUNNER_TEMP/Apps/TayraLanguages.app/Contents/app/TayraLanguages.cfg"
          for i in $(seq 1 90); do grep -q "tayra.version=$NEW" "$cfg" 2>/dev/null && break; sleep 2; done
          cat "$RUNNER_TEMP/work dir/update.log" || true
          grep "tayra.version" "$cfg"
          grep -q "tayra.version=$NEW" "$cfg"
          test "$(ls "$RUNNER_TEMP/Apps")" = "TayraLanguages.app"

  windows:
    name: Windows MSI
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the old and the new MSI
        run: |
          B=desktopApp/build/compose/binaries/main
          ./gradlew --no-daemon :desktopApp:packageMsi -PreleaseVersion=$OLD
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/feed"
          cp $B/msi/*.msi "$RUNNER_TEMP/old/old.msi"
          rm -rf $B/msi
          ./gradlew --no-daemon :desktopApp:packageMsi -PreleaseVersion=$NEW
          cp $B/msi/*.msi "$RUNNER_TEMP/feed/TayraLanguages-$NEW-windows-x64.msi"
      - name: Install the old version
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$env:RUNNER_TEMP\old\old.msi`"", '/quiet', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\old\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\old\install.log" -Tail 60; exit 1 }
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 3 -Filter TayraLanguages.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "No TayraLanguages.exe under $env:LOCALAPPDATA"; exit 1 }
          Write-Host "Installed at $($exe.FullName)"
          "LAUNCHER=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Update the old version as it does itself
        run: |
          (cd "$RUNNER_TEMP/feed" && python "$GITHUB_WORKSPACE/tools/make_update_feed.py" $NEW http://127.0.0.1:8765 TayraLanguages-$NEW-windows-x64.msi)
          (cd "$RUNNER_TEMP/feed" && python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &)
          sleep 3
          TAYRA_UPDATE_LAUNCHER="$LAUNCHER" TAYRA_UPDATE_FROM=$OLD TAYRA_UPDATE_FEED=$FEED \
            TAYRA_UPDATE_WORK="$RUNNER_TEMP\\work dir" TAYRA_UPDATE_EXPECT=WINDOWS_MSI \
            ./gradlew --no-daemon :core:data:jvmTest --tests '*UpdateInstallCheck*' --rerun -i > "$RUNNER_TEMP/check.log" 2>&1 || { tail -80 "$RUNNER_TEMP/check.log"; exit 1; }
          grep -E "Installing|would quit" "$RUNNER_TEMP/check.log"
      - name: Check that the new version took the old one's place
        shell: pwsh
        run: |
          $cfg = Join-Path (Split-Path $env:LAUNCHER) 'app\TayraLanguages.cfg'
          $updated = $false
          for ($i = 0; $i -lt 120; $i++) {
            if (Select-String -Path $cfg -Pattern "tayra.version=$env:NEW" -Quiet -ErrorAction SilentlyContinue) { $updated = $true; break }
            Start-Sleep -Seconds 2
          }
          Get-Content "$env:RUNNER_TEMP\work dir\update.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\work dir\TayraLanguages-$env:NEW-windows-x64.msi.log" -Tail 40 -ErrorAction SilentlyContinue
          Select-String -Path $cfg -Pattern "tayra.version"
          if (-not $updated) { exit 1 }
          Get-Process TayraLanguages -ErrorAction SilentlyContinue | Format-Table Id, Path

  linux:
    name: Linux DEB and tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Build the old and the new packages
        run: |
          B=desktopApp/build/compose/binaries/main
          ./gradlew --no-daemon :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable -PreleaseVersion=$OLD
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/feed" "$RUNNER_TEMP/tar" rpms
          cp $B/deb/*.deb "$RUNNER_TEMP/old/old.deb"
          cp $B/rpm/*.rpm rpms/old.rpm
          cp -r $B/app/tayra-languages "$RUNNER_TEMP/tar/"
          rm -rf $B/deb $B/rpm $B/app
          ./gradlew --no-daemon :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable -PreleaseVersion=$NEW
          cp $B/deb/*.deb "$RUNNER_TEMP/feed/TayraLanguages-$NEW-linux-amd64.deb"
          cp $B/rpm/*.rpm "$RUNNER_TEMP/feed/TayraLanguages-$NEW-linux-x86_64.rpm"
          cp $B/rpm/*.rpm rpms/new.rpm
          tar -czf "$RUNNER_TEMP/feed/TayraLanguages-$NEW-linux-x64.tar.gz" -C $B/app .
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: rpms
      - name: Install the old Debian package
        run: |
          sudo apt-get install -y "$RUNNER_TEMP/old/old.deb"
          grep "tayra.version=$OLD" /opt/tayra-languages/lib/app/tayra-languages.cfg
      - name: Update both old versions as they do themselves
        run: |
          (cd "$RUNNER_TEMP/feed" && python3 "$GITHUB_WORKSPACE/tools/make_update_feed.py" $NEW http://127.0.0.1:8765 TayraLanguages-$NEW-linux-amd64.deb TayraLanguages-$NEW-linux-x86_64.rpm TayraLanguages-$NEW-linux-x64.tar.gz)
          (cd "$RUNNER_TEMP/feed" && python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &)
          sleep 2
          for target in "/opt/tayra-languages/bin/tayra-languages LINUX_DEB deb" "$RUNNER_TEMP/tar/tayra-languages/bin/tayra-languages LINUX_TAR tar"; do
            set -- $target
            TAYRA_UPDATE_LAUNCHER="$1" TAYRA_UPDATE_FROM=$OLD TAYRA_UPDATE_FEED=$FEED TAYRA_UPDATE_WORK="$RUNNER_TEMP/work $3" TAYRA_UPDATE_EXPECT=$2 \
              ./gradlew --no-daemon :core:data:jvmTest --tests '*UpdateInstallCheck*' --rerun -i > "$RUNNER_TEMP/check.log" 2>&1 || { tail -80 "$RUNNER_TEMP/check.log"; exit 1; }
            grep -E "Installing|would quit" "$RUNNER_TEMP/check.log"
          done
      - name: Check that the new versions took the old ones' place
        run: |
          deb=/opt/tayra-languages/lib/app/tayra-languages.cfg
          tarball="$RUNNER_TEMP/tar/tayra-languages/lib/app/tayra-languages.cfg"
          for i in $(seq 1 90); do grep -q "tayra.version=$NEW" "$tarball" 2>/dev/null && break; sleep 2; done
          cat "$RUNNER_TEMP/work deb/update.log" "$RUNNER_TEMP/work tar/update.log" || true
          grep -H "tayra.version" "$deb" "$tarball"
          grep -q "tayra.version=$NEW" "$deb"
          grep -q "tayra.version=$NEW" "$tarball"
          dpkg-query -W tayra-languages
          test "$(ls "$RUNNER_TEMP/tar")" = "tayra-languages"

  rpm:
    name: Linux RPM
    needs: linux
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: rpms
      - name: Install the old package, then upgrade it with the command the app runs
        run: |
          dnf install -y ./rpms/old.rpm
          grep "tayra.version=$OLD" /opt/tayra-languages/lib/app/tayra-languages.cfg
          # The app runs this under pkexec, which asks for the password.
          rpm -U --replacepkgs ./rpms/new.rpm
          grep "tayra.version=$NEW" /opt/tayra-languages/lib/app/tayra-languages.cfg
          rpm -q tayra-languages
