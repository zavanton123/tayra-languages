name: User guide site

# Publishes docs/guide as a website on GitHub Pages whenever the guide changes on main.
on:
  push:
    branches: [main]
    paths:
      - docs/guide/**
      - docs/guide-site/**
      - .github/workflows/guide.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.8.2
      - run: mkdocs build --strict
        working-directory: docs/guide-site
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/guide-site/build/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
