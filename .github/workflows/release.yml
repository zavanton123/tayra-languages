name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach artifacts to (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # The account service is accountServer in gradle.properties, the same for every build; it wins over
  # this variable, which only matters if that line is ever removed.
  IDIOMIKO_ACCOUNT_SERVER: ${{ vars.ACCOUNT_SERVER }}
  # The JetBrains Runtime the desktop apps ship with: its JCEF build carries the Chromium that plays videos.
  JBR_JDK: 21.0.10
  JBR_BUILD: b1163.110

# Data releases (courses-v1, freedict-v1, ...) only carry data files, so the apps are built for app tags (vX.Y.Z) alone,
# and a data release hands the "latest" mark back to the newest app release, which the app's updates and the README link to.
jobs:
  android:
    name: Android APK
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    # Job-level, so the steps' conditions can see whether they are set.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FIREBASE_APPDIST_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_APPDIST_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Every release is signed with the same key, or installed apps could not update to it.
      - name: Write signing keystore
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "The ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :androidApp:assembleRelease \
            -PreleaseVersion="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "Idiomiko-$VERSION.apk"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" Idiomiko-*.apk --clobber
      # Testers in the Firebase group "testers" get each release through App Distribution.
      - name: Send the APK to Firebase App Distribution
        if: ${{ env.FIREBASE_APPDIST_SERVICE_ACCOUNT != '' && vars.FIREBASE_ANDROID_APP_ID != '' }}
        run: |
          printf '%s' "$FIREBASE_APPDIST_SERVICE_ACCOUNT" > "$RUNNER_TEMP/appdist.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/appdist.json" npx --yes firebase-tools@13.0.0 appdistribution:distribute \
            Idiomiko-*.apk --app "${{ vars.FIREBASE_ANDROID_APP_ID }}" --groups testers \
            --release-notes "Idiomiko ${RELEASE_TAG#v}"

  macos:
    name: macOS DMG
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch JetBrains Runtime
        run: |
          mkdir -p "$RUNNER_TEMP/jbr" && cd "$RUNNER_TEMP/jbr"
          curl -fsSL "https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-$JBR_JDK-osx-aarch64-$JBR_BUILD.tar.gz" | tar -xz
          # The runtime's root: the folder with `release`, or on macOS the bundle around Contents/Home.
          home=$(dirname "$(find "$PWD" -maxdepth 4 -name release | head -1)")
          if [ "$(basename "$home")" = Home ]; then home=$(dirname "$(dirname "$home")"); fi
          if command -v cygpath >/dev/null; then home=$(cygpath -m "$home"); fi
          echo "IDIOMIKO_JBR=$home" >> "$GITHUB_ENV"
      - name: Build DMG
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageDmg -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg "Idiomiko-$VERSION-macos-arm64.dmg"
      - name: Attach DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" Idiomiko-*.dmg --clobber

  # Unsigned, as the project has no Apple team: AltStore or Sideloadly sign it with the installer's own Apple ID.
  ios:
    name: iOS IPA (unsigned)
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pods
        run: |
          command -v pod >/dev/null || sudo gem install cocoapods
          cd iosApp && pod install
      - name: Build IPA
        run: |
          VERSION="${RELEASE_TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" iosApp/iosApp/Info.plist
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ios/Build/Products/Release-iphoneos/"*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Idiomiko-$VERSION-ios-unsigned.ipa" Payload)
      - name: Attach IPA to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" Idiomiko-*.ipa --clobber

  windows:
    name: Windows MSI
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch JetBrains Runtime
        run: |
          mkdir -p "$RUNNER_TEMP/jbr" && cd "$RUNNER_TEMP/jbr"
          curl -fsSL "https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-$JBR_JDK-windows-x64-$JBR_BUILD.tar.gz" | tar -xz
          # The runtime's root: the folder with `release`, or on macOS the bundle around Contents/Home.
          home=$(dirname "$(find "$PWD" -maxdepth 4 -name release | head -1)")
          if [ "$(basename "$home")" = Home ]; then home=$(dirname "$(dirname "$home")"); fi
          if command -v cygpath >/dev/null; then home=$(cygpath -m "$home"); fi
          echo "IDIOMIKO_JBR=$home" >> "$GITHUB_ENV"
      - name: Build MSI
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageMsi -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/msi/*.msi "Idiomiko-$VERSION-windows-x64.msi"
      - name: Attach MSI to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" Idiomiko-*.msi --clobber

  linux:
    name: Linux DEB, RPM and tarball
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch JetBrains Runtime
        run: |
          mkdir -p "$RUNNER_TEMP/jbr" && cd "$RUNNER_TEMP/jbr"
          curl -fsSL "https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-$JBR_JDK-linux-x64-$JBR_BUILD.tar.gz" | tar -xz
          # The runtime's root: the folder with `release`, or on macOS the bundle around Contents/Home.
          home=$(dirname "$(find "$PWD" -maxdepth 4 -name release | head -1)")
          if [ "$(basename "$home")" = Home ]; then home=$(dirname "$(dirname "$home")"); fi
          if command -v cygpath >/dev/null; then home=$(cygpath -m "$home"); fi
          echo "IDIOMIKO_JBR=$home" >> "$GITHUB_ENV"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Build packages
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/deb/*.deb "Idiomiko-$VERSION-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "Idiomiko-$VERSION-linux-x86_64.rpm"
          # For other distributions: unpack anywhere and run idiomiko/bin/idiomiko.
          tar -czf "Idiomiko-$VERSION-linux-x64.tar.gz" -C desktopApp/build/compose/binaries/main/app .
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" Idiomiko-*.deb Idiomiko-*.rpm Idiomiko-*.tar.gz --clobber

  web:
    name: Web app
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # app.idiomiko.com fetches this from the release and serves it (the service's deploy/webapp);
      # the source maps stay out.
      - name: Build the web app
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :webApp:wasmJsBrowserDistribution
          dist=webApp/build/dist/wasmJs/productionExecutable
          printf '{"version":"%s"}\n' "$VERSION" > "$dist/version.json"
          tar -czf "Idiomiko-$VERSION-web.tar.gz" --exclude='*.map' -C "$dist" .
      - name: Attach the web app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" Idiomiko-*-web.tar.gz --clobber

  keep-app-latest:
    name: Keep the newest app release marked latest
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark the newest vX.Y.Z release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')
          if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest; fi
