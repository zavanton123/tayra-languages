name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach artifacts to (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

# Course-pack releases (courses-v1, ...) only carry data files, so the apps are built for app tags alone.
jobs:
  android:
    name: Android APK
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag, 'courses-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Write signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :androidApp:assembleRelease \
            -PreleaseVersion="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "TayraLanguages-$VERSION.apk"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.apk --clobber

  macos:
    name: macOS DMG
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag, 'courses-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageDmg -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg "TayraLanguages-$VERSION-macos-arm64.dmg"
      - name: Attach DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.dmg --clobber

  windows:
    name: Windows MSI
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag, 'courses-') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageMsi -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/msi/*.msi "TayraLanguages-$VERSION-windows-x64.msi"
      - name: Attach MSI to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.msi --clobber

  linux:
    name: Linux DEB, RPM and tarball
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag, 'courses-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Build packages
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/deb/*.deb "TayraLanguages-$VERSION-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "TayraLanguages-$VERSION-linux-x86_64.rpm"
          # For other distributions: unpack anywhere and run tayra-languages/bin/tayra-languages.
          tar -czf "TayraLanguages-$VERSION-linux-x64.tar.gz" -C desktopApp/build/compose/binaries/main/app .
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.deb TayraLanguages-*.rpm TayraLanguages-*.tar.gz --clobber
