name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach artifacts to (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # The account service the apps are built to use (the repository variable ACCOUNT_SERVER, such as
  # https://api.example.com); without it they are built without accounts, sync and cloud backups.
  TAYRA_ACCOUNT_SERVER: ${{ vars.ACCOUNT_SERVER }}

# Data releases (courses-v1, freedict-v1, ...) only carry data files, so the apps are built for app tags (vX.Y.Z) alone,
# and a data release hands the "latest" mark back to the newest app release, which the app's updates and the README link to.
jobs:
  backend:
    name: Backend image
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the service
        run: ./gradlew --no-daemon :backend:test :backend:bootJar
      # The image the service is deployed from: ghcr.io/<owner>/tayra-backend:<version>, and :latest.
      - name: Publish the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/tayra-backend"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" backend
          docker push --all-tags "$IMAGE"

  android:
    name: Android APK
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Write signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :androidApp:assembleRelease \
            -PreleaseVersion="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "TayraLanguages-$VERSION.apk"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.apk --clobber

  macos:
    name: macOS DMG
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageDmg -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg "TayraLanguages-$VERSION-macos-arm64.dmg"
      - name: Attach DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.dmg --clobber

  # Unsigned, as the project has no Apple team: AltStore or Sideloadly sign it with the installer's own Apple ID.
  ios:
    name: iOS IPA (unsigned)
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pods
        run: |
          command -v pod >/dev/null || sudo gem install cocoapods
          cd iosApp && pod install
      - name: Build IPA
        run: |
          VERSION="${RELEASE_TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" iosApp/iosApp/Info.plist
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ios/Build/Products/Release-iphoneos/"*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/TayraLanguages-$VERSION-ios-unsigned.ipa" Payload)
      - name: Attach IPA to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.ipa --clobber

  windows:
    name: Windows MSI
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageMsi -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/msi/*.msi "TayraLanguages-$VERSION-windows-x64.msi"
      - name: Attach MSI to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.msi --clobber

  linux:
    name: Linux DEB, RPM and tarball
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Build packages
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable -PreleaseVersion="$VERSION"
          cp desktopApp/build/compose/binaries/main/deb/*.deb "TayraLanguages-$VERSION-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "TayraLanguages-$VERSION-linux-x86_64.rpm"
          # For other distributions: unpack anywhere and run tayra-languages/bin/tayra-languages.
          tar -czf "TayraLanguages-$VERSION-linux-x64.tar.gz" -C desktopApp/build/compose/binaries/main/app .
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TayraLanguages-*.deb TayraLanguages-*.rpm TayraLanguages-*.tar.gz --clobber

  keep-app-latest:
    name: Keep the newest app release marked latest
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark the newest vX.Y.Z release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')
          if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest; fi
