# The backend with its database, as in development and on a box of its own:
#   ./gradlew :backend:bootJar && docker compose -f backend/docker-compose.yml up --build
# Postgres listens on 5433 and the service on 8080 unless TAYRA_DB_PORT and TAYRA_PORT say otherwise.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: tayra
      POSTGRES_USER: tayra
      POSTGRES_PASSWORD: tayra
    ports:
      - "${TAYRA_DB_PORT:-5433}:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayra -d tayra"]
      interval: 2s
      retries: 30
  # Stands in for the S3-compatible storage of cloud backups (R2, B2 or Hetzner in production).
  storage:
    image: adobe/s3mock:4.7.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tayra-backups
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      S3_ENDPOINT: http://storage:9090
      TAYRA_FREE_EMAILS: ${TAYRA_FREE_EMAILS:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      GOOGLE_DESKTOP_CLIENT_ID: ${GOOGLE_DESKTOP_CLIENT_ID:-}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${GOOGLE_DESKTOP_CLIENT_SECRET:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-production}
      PADDLE_MONTHLY_PRICE: ${PADDLE_MONTHLY_PRICE:-}
      PADDLE_YEARLY_PRICE: ${PADDLE_YEARLY_PRICE:-}
      PADDLE_PORTAL_URL: ${PADDLE_PORTAL_URL:-}
      APPLE_BUNDLE_IDS: ${APPLE_BUNDLE_IDS:-}
      APPLE_ROOT_CERTIFICATES: ${APPLE_ROOT_CERTIFICATES:-}
      GOOGLE_PLAY_PACKAGE: ${GOOGLE_PLAY_PACKAGE:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${GOOGLE_PLAY_SERVICE_ACCOUNT:-}
      GOOGLE_PLAY_PUSH_TOKEN: ${GOOGLE_PLAY_PUSH_TOKEN:-}
      DATABASE_URL: jdbc:postgresql://db:5432/tayra
      DATABASE_USER: tayra
      DATABASE_PASSWORD: tayra
    ports:
      - "${TAYRA_PORT:-8080}:8080"
volumes:
  db:
