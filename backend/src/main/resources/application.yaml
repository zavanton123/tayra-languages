# Every setting comes from the environment, so the service runs the same on a platform or a box of
# its own (docs/SYNC_BACKEND_DESIGN.md, Portability). The defaults suit docker-compose.yml.
spring:
  application:
    name: tayra-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tayra}
    username: ${DATABASE_USER:tayra}
    password: ${DATABASE_PASSWORD:tayra}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      enabled: false
server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind a platform's proxy, the client's address from the proxy's headers, for the rate limits.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  compression:
    enabled: true
    mime-types: application/json
  # Mail goes by SMTP once SPRING_MAIL_HOST (with _PORT, _USERNAME, _PASSWORD) is set, as Resend and
  # Postmark offer; without it, mail is only written to the log.
  mail:
    properties:
      mail.smtp.starttls.enable: true
management:
  endpoints:
    web:
      exposure:
        # Metrics answer only requests carrying the admin token (SecurityConfig).
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
tayra:
  auth:
    # At least 32 bytes; signs the access tokens. The default is for development only.
    jwt-secret: ${JWT_SECRET:development-only-secret-change-me-0123456789}
    access-token-minutes: 15
    refresh-token-days: 90
    # Sign-in with Google and Apple: the apps' client ids, comma-separated. Empty turns the provider off.
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuers: https://accounts.google.com,accounts.google.com
    apple:
      client-ids: ${APPLE_CLIENT_IDS:}
      jwks-uri: ${APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}
      issuers: https://appleid.apple.com
  # Requests an address may make a minute: signing up and in, codes and resets; and the rest.
  rate-limits:
    auth-per-minute: ${RATE_LIMIT_AUTH:20}
    other-per-minute: ${RATE_LIMIT_OTHER:600}
  # The web app's origins, comma-separated, such as https://app.example.com: they may call the service
  # with the sign-in cookie. Empty for none.
  web-origins: ${WEB_ORIGINS:}
  # Lets /actuator/metrics answer requests with this X-Admin-Token header; empty keeps metrics closed.
  admin-token: ${ADMIN_TOKEN:}
  # Accounts that may sync without paying, comma-separated: the owner's own, before billing exists.
  free-emails: ${TAYRA_FREE_EMAILS:}
  # Cloud backups: any S3-compatible storage (S3Mock in development, R2, B2 or Hetzner in production).
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9090}
    region: ${S3_REGION:auto}
    bucket: ${S3_BUCKET:tayra-backups}
    access-key: ${S3_ACCESS_KEY:development}
    secret-key: ${S3_SECRET_KEY:development}
  backups:
    keep: 3
    max-megabytes: 300
  mail:
    from: ${MAIL_FROM:Tayra Languages <no-reply@localhost>}
