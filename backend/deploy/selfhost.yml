# The service on a box of its own (Hetzner-style), on top of docker-compose.yml: Caddy in front with
# HTTPS for the domain, the real bucket instead of S3Mock, and the database dumped to the bucket
# every night. Paths are the first file's, backend/. Caddy is a trusted internal proxy to Tomcat, so
# the rate limits see each client's own address. With the settings in an env file (see backend/deploy/README.md):
#   docker compose -f backend/docker-compose.yml -f backend/deploy/selfhost.yml --env-file /etc/tayra.env up --build -d
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    # Only the service and the backups reach the database.
    ports: !reset []
    restart: unless-stopped
  storage:
    # S3Mock is for development: the box uses the real bucket.
    profiles: ["development"]
  app:
    depends_on: !override
      db:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, at least 32 bytes}
    # Everything else in the settings file reaches the service as it is, mail among it (MAIL_FROM,
    # SPRING_MAIL_HOST, _PORT, _USERNAME, _PASSWORD), which must not be set at all when unused.
    env_file:
      - path: ${TAYRA_ENV_FILE:-/etc/tayra.env}
        required: false
    # Reached through Caddy only.
    ports: !reset []
    restart: unless-stopped
  caddy:
    image: caddy:2.10
    depends_on: [app]
    environment:
      TAYRA_DOMAIN: ${TAYRA_DOMAIN:?set TAYRA_DOMAIN, such as api.example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    restart: unless-stopped
  backup:
    build: ./deploy/backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: tayra
      PGUSER: tayra
      PGPASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      KEEP_DUMPS: ${KEEP_DUMPS:-14}
    restart: unless-stopped
volumes:
  caddy:
