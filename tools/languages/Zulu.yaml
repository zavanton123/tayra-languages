name: Zulu
dictionaries:
  - for: terms
    type: embedded
    url: "https://en.wiktionary.org/wiki/[WORD]#Zulu"
  - for: terms
    type: popup
    url: "https://glosbe.com/zu/en/[WORD]"
  - for: sentences
    type: popup
    url: "https://translate.google.com/?sl=zu&tl=en&text=[WORD]&op=translate"
character_substitutions: "´='|`='|’='|‘='|...=…|..=‥"
