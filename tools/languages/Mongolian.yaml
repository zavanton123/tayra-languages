name: Mongolian
dictionaries:
  - for: terms
    type: embedded
    url: "https://en.wiktionary.org/wiki/[WORD]#Mongolian"
  - for: terms
    type: popup
    url: "https://glosbe.com/mn/en/[WORD]"
  - for: sentences
    type: popup
    url: "https://translate.google.com/?sl=mn&tl=en&text=[WORD]&op=translate"
character_substitutions: "´='|`='|’='|‘='|...=…|..=‥"
split_sentences: ".!?"
split_sentence_exceptions: "г.м.|ж.нь|т.б.|ш.в."
word_chars: "А-Яа-яЁёӨөҮү'"
right_to_left: false
show_romanization: false
parser_type: spacedel
