name: Uzbek
dictionaries:
  - for: terms
    type: embedded
    url: "https://en.wiktionary.org/wiki/[WORD]#Uzbek"
  - for: terms
    type: popup
    url: "https://glosbe.com/uz/en/[WORD]"
  - for: sentences
    type: popup
    url: "https://translate.google.com/?sl=uz&tl=en&text=[WORD]&op=translate"
character_substitutions: "´='|`='|’='|‘='|...=…|..=‥"
split_sentences: ".!?"
split_sentence_exceptions: "h.k.|mln.|mlrd.|prof.|Prof.|akad.|dots.|t.f.n.|f.f.d."
word_chars: "a-zA-ZÀ-ÖØ-öø-ȳʻʼ"
right_to_left: false
show_romanization: false
parser_type: uzbek
